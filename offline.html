<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F3D22E" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Sin internet · Crea tu Empresa</title>
    <style>
      :root { --amarillo: #f3d22e; --rosa: #cf3588; --tinta: #33302b; --papel: #fffdf6; --suave: #6b655c; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
        background: var(--amarillo); color: var(--tinta);
        font: 18px/1.5 Nunito, 'Segoe UI', system-ui, -apple-system, sans-serif;
      }
      main {
        max-width: 460px; width: 100%; background: var(--papel); border-radius: 28px; padding: 32px 26px;
        text-align: center; box-shadow: 0 10px 0 rgba(51, 48, 43, 0.15);
      }
      .bit { width: 96px; height: 96px; }
      h1 { font: 800 28px/1.15 Poppins, 'Segoe UI', system-ui, sans-serif; margin: 14px 0 10px; }
      p { margin: 0 0 12px; }
      .suave { color: var(--suave); font-size: 16px; }
      .botones { display: flex; flex-direction: column; gap: 10px; margin-top: 22px; }
      a, button {
        font: 800 18px/1 Nunito, system-ui, sans-serif; border: 0; border-radius: 999px; padding: 15px 20px;
        cursor: pointer; text-decoration: none; display: block;
      }
      .primario { background: var(--rosa); color: #fff; }
      .secundario { background: #f7f1e2; color: var(--tinta); }
      a:focus-visible, button:focus-visible { outline: 3px solid var(--tinta); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <svg class="bit" viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="16" fill="#F3D22E" />
        <circle cx="32" cy="34" r="18" fill="#E24C9A" />
        <circle cx="25" cy="31" r="4" fill="#fff" />
        <circle cx="39" cy="31" r="4" fill="#fff" />
        <path d="M25 43c4-3 10-3 14 0" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" />
        <rect x="29" y="6" width="6" height="10" rx="3" fill="#33302B" />
      </svg>
      <h1>¡Uy, no hay internet!</h1>
      <p>Necesitás internet para jugar misiones y usar la tienda.</p>
      <p class="suave">Mientras tanto, podés leer el libro: las páginas que ya abriste quedan guardadas en este dispositivo.</p>
      <div class="botones">
        <button type="button" class="primario" onclick="location.reload()">Probar de nuevo</button>
        <a class="secundario" href="/mapa">Ir al libro</a>
      </div>
    </main>
  </body>
</html>
